name: Application With Nginx System
on:
  pull_request
  # push:
  #   branches: ["main"]
  # paths:
  #   - ".github/workflows/vps-prod.yaml"
  #   - "docker/Dockerfile"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build Application and Send to VPS
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Depedencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Clean VPS directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 2233
          script: |
            rm -rf /var/www/lab-devops3-fe-jerr/*

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: 2233
          source: "dist/*" #output after build
          target: "/var/www/lab-devops3-fe-jerr/"

      # - name: Deploy project over SSH
