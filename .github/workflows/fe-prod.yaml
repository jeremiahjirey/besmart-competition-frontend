name: Application With Nginx System
on:
  pull_request:
    branches:
      - main
  # push:
  #   branches: ["main"]
  # paths:
  #   - ".github/workflows/vps-prod.yaml"
  #   - "docker/Dockerfile"

jobs:
  setup-project:
    runs-on: ubuntu-latest
    name: Build Application and Send to VPS
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Depedencies
        run: npm ci

  security-validation:
    needs: setup-project
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # - name: Run lint
      #   run: npm run lint

      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2 # Scan protected file

      - name: Dependency Scan
        run: npm audit --omit=dev --audit-level=high # scan dependency in production stage

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1 # Security scan untuk kelemahan kode

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/

  build-and-deploy:
    needs: security-validation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      # - name: Clean VPS directory
      #   uses: appleboy/ssh-action@v1.2.0
